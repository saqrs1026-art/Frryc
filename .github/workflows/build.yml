name: Build Flutter APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Extract ZIP file
        run: |
          mkdir -p project_folder
          unzip Orange_flutter.zip -d project_folder
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
      - name: Build APK
        run: |
          cd project_folder
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" -maxdepth 3 | head -n 1))
          cd "$PROJECT_DIR"
          
          # كود بايثون شامل يحل جميع مشاكل التعارضات دفعة واحدة وبشكل نهائي
          python3 -c "
          import re
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          
          # إزالة أي قسم dependency_overrides قديم لمنع التكرار
          content = re.sub(r'dependency_overrides:.*', '', content, flags=re.DOTALL)
          
          # إضافة جميع التجاوزات الشاملة لحل مشاكل collection والإعلانات والإشعارات
          overrides = '''
          dependency_overrides:
            collection: ^1.19.1
            google_mobile_ads: ^5.2.0
            flutter_local_notifications: ^17.2.4
          '''
          content += '\n' + overrides
          
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "
          
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/app-release.apk'
