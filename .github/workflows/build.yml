name: Build Flutter APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Extract ZIP file
        run: |
          mkdir -p project_folder
          unzip Orange_flutter.zip -d project_folder
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
      - name: Build APK
        run: |
          cd project_folder
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" -maxdepth 3 | head -n 1))
          cd "$PROJECT_DIR"
          
          # إضافة التعديلات والتجاوزات بطريقة آمنة بدون تكرار
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          if 'dependency_overrides:' in content:
              content = content.replace('dependency_overrides:', 'dependency_overrides:\n  collection: ^1.19.1\n  google_mobile_ads: ^5.4.0')
          else:
              content += '\ndependency_overrides:\n  collection: ^1.19.1\n  google_mobile_ads: ^5.4.0\n'
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "
          
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/app-release.apk'
